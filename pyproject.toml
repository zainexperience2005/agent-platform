[project]
name = "agent-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zainexperience2005", email = "zainexperience0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "authlib>=1.8.0",
    "bcrypt<5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.4",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "testcontainers[postgres]>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.28",
    "redis>=5.0",
]

[project.scripts]
agent-platform = "agent_platform:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
asyncio_mode = "auto"
