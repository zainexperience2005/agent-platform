[project]
name = "agent-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zainexperience2005", email = "zainexperience0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.4",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "psycopg>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agent-platform = "agent_platform:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
